<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Court Check-In</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#1d1b19;--muted:#7a736b;--accent:#e8590c;--accent-t:#fff;--line:#e5dfd6;--ok:#2b8a3e;--err:#c92a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#23201d;--text:#f2ede6;--muted:#a1988d;--line:#38332e;--ok:#51cf66;--err:#ff8787}}
:root[data-theme="dark"]{--bg:#171513;--card:#23201d;--text:#f2ede6;--muted:#a1988d;--line:#38332e;--ok:#51cf66;--err:#ff8787}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:4px 0}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card.here{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:18px;font-weight:700}
.count{font-size:13px;color:var(--muted);margin-top:2px}
button{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;background:var(--accent);color:var(--accent-t);cursor:pointer}
button.out{background:transparent;color:var(--ok);border:1.5px solid var(--ok)}
ul{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
li span:last-child{color:var(--muted)}
.msg{color:var(--err);font-size:13px;margin:0 0 12px;min-height:0}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>🏀 Court Check-In</h1>
  <p class="sub">See who's hooping and let everyone know you're there.</p>
  <input id="who" placeholder="Your name & age & ovr" maxlength="24" autocomplete="off">
  <p class="msg" id="msg"></p>
  <div id="parks"></div>
  <p class="foot">Check-ins expire after 3 hours · updates every 10s</p>
</main>
<script>
// 👇 PASTE YOUR FIREBASE REALTIME DATABASE URL HERE (no trailing slash)
const DB_URL = "https://check-in-d31e8-default-rtdb.firebaseio.com/";

const PARKS=["Sierra Bella","Green River Clubhouse","Cerritos Courts"];
const TTL=3*3600*1000;
let checkins={}; // id -> {park,name,t}
let myId=null, myName="";
try{myId=localStorage.getItem("court-id");myName=localStorage.getItem("court-name")||""}catch(e){}
if(!myId){myId="u"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem("court-id",myId)}catch(e){}}
const who=document.getElementById("who"), msg=document.getElementById("msg");
who.value=myName;
who.addEventListener("input",()=>{try{localStorage.setItem("court-name",who.value)}catch(e){}});

function err(t){msg.textContent=t||""}
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"just now":m<60?m+" min ago":Math.floor(m/60)+"h "+(m%60)+"m ago"}

async function load(){
  if(!DB_URL){err("Setup needed: add your Firebase database URL to index.html.");render();return}
  try{
    const r=await fetch(DB_URL+"/checkins.json");
    if(!r.ok)throw new Error(r.status);
    const d=await r.json()||{};
    const now=Date.now();
    checkins={};
    for(const [id,c] of Object.entries(d)){
      if(c&&now-c.t<TTL)checkins[id]=c;
      else if(id===myId)fetch(DB_URL+"/checkins/"+id+".json",{method:"DELETE"}).catch(()=>{});
    }
    err("");
  }catch(e){err("Can't reach the server. Retrying…")}
  render();
}

async function toggle(p){
  if(!DB_URL)return;
  const mine=checkins[myId];
  const url=DB_URL+"/checkins/"+myId+".json";
  try{
    if(mine&&mine.park===p){
      delete checkins[myId];render();
      await fetch(url,{method:"DELETE"});
    }else{
      const c={park:p,name:who.value.trim()||"Player",t:Date.now()};
      checkins[myId]=c;render();
      const r=await fetch(url,{method:"PUT",body:JSON.stringify(c)});
      if(!r.ok)throw new Error(r.status);
    }
    err("");
  }catch(e){err("Couldn't save. Check your connection and try again.");load()}
}

function render(){
  const el=document.getElementById("parks");
  el.innerHTML="";
  PARKS.forEach(p=>{
    const list=Object.entries(checkins).filter(([,c])=>c.park===p).sort((a,b)=>a[1].t-b[1].t);
    const here=list.some(([id])=>id===myId);
    const d=document.createElement("div");
    d.className="card"+(here?" here":"");
    d.innerHTML=`<div class="row"><div><div class="name"></div><div class="count">${list.length?list.length+" checked in":"No one yet"}</div></div><button class="${here?"out":""}">${here?"✓ Here · Leave":"Check in"}</button></div>`;
    d.querySelector(".name").textContent=p;
    d.querySelector("button").onclick=()=>toggle(p);
    if(list.length){
      const ul=document.createElement("ul");
      list.forEach(([id,c])=>{const li=document.createElement("li");const a=document.createElement("span");a.textContent=c.name+(id===myId?" (you)":"");const b=document.createElement("span");b.textContent=ago(c.t);li.append(a,b);ul.append(li)});
      d.append(ul);
    }
    el.append(d);
  });
}
load();
setInterval(load,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
