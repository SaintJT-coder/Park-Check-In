name: Validate Court Check-In frontend
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/validate-frontend.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-smoke.cjs
