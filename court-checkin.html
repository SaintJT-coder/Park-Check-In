<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Court Check-In</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#1d1b19;--muted:#7a736b;--accent:#e8590c;--accent-t:#fff;--line:#e5dfd6;--ok:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#23201d;--text:#f2ede6;--muted:#a1988d;--line:#38332e;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#171513;--card:#23201d;--text:#f2ede6;--muted:#a1988d;--line:#38332e;--ok:#51cf66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card.here{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:18px;font-weight:700}
.count{font-size:13px;color:var(--muted);margin-top:2px}
button{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;background:var(--accent);color:var(--accent-t);cursor:pointer}
button.out{background:transparent;color:var(--ok);border:1.5px solid var(--ok)}
ul{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
li span:last-child{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1>🏀 Court Check-In</h1>
  <p class="sub">Tap a park to let people know you're hooping.</p>
  <input id="who" placeholder="Your name" maxlength="24" autocomplete="off">
  <div id="parks"></div>
  <p class="foot">Check-ins expire after 3 hours. Saved on this device.</p>
</main>
<script>
const PARKS=["Sierra Bella","Green River Clubhouse","Cerritos Courts"];
const TTL=3*3600*1000;
let data={checkins:[],name:""};
try{const r=localStorage.getItem("court-checkins");if(r)data=Object.assign(data,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("court-checkins",JSON.stringify(data))}catch(e){}}
function prune(){data.checkins=data.checkins.filter(c=>Date.now()-c.t<TTL)}
const who=document.getElementById("who");
who.value=data.name||"";
who.addEventListener("input",()=>{data.name=who.value;save()});
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"just now":m<60?m+" min ago":Math.floor(m/60)+"h "+(m%60)+"m ago"}
function toggle(p){
  prune();
  const name=(who.value.trim()||"Player");
  const mine=data.checkins.find(c=>c.me&&c.park===p);
  data.checkins=data.checkins.filter(c=>!c.me);
  if(!mine)data.checkins.push({park:p,name,t:Date.now(),me:true});
  save();render();
}
function render(){
  prune();
  const el=document.getElementById("parks");
  el.innerHTML="";
  PARKS.forEach(p=>{
    const list=data.checkins.filter(c=>c.park===p);
    const here=list.some(c=>c.me);
    const d=document.createElement("div");
    d.className="card"+(here?" here":"");
    d.innerHTML=`<div class="row"><div><div class="name"></div><div class="count">${list.length?list.length+" checked in":"No one yet"}</div></div><button class="${here?"out":""}">${here?"✓ Here · Leave":"Check in"}</button></div>`;
    d.querySelector(".name").textContent=p;
    d.querySelector("button").onclick=()=>toggle(p);
    if(list.length){
      const ul=document.createElement("ul");
      list.forEach(c=>{const li=document.createElement("li");const a=document.createElement("span");a.textContent=c.name+(c.me?" (you)":"");const b=document.createElement("span");b.textContent=ago(c.t);li.append(a,b);ul.append(li)});
      d.append(ul);
    }
    el.append(d);
  });
}
render();
setInterval(render,30000);
</script>
</body>
</html>
